# CI del servicio crawler (PR-019 · FR-003 · ADR-0011 · plan §CI strategy).
# Aditivo: job independiente que NO altera la pipeline JS (quality.yml) ni el
# job del spike (python-quality.yml). Se dispara también ante cambios en
# services/search-spike/** porque xtrace_spike es dependencia editable (ADR-0011).
#
# DECISION (PR-037 · security-review P2-CI · precedente del spike, misma
# politica que python-quality.yml de la fase 1): pgTAP y los tests de
# integracion contra Postgres/pgvector NO corren en CI — requieren el stack
# Supabase completo — y se ejecutan localmente como gates del plan
# §CI strategy:
#   supabase start        # stack local (Postgres + pgvector)
#   supabase test db      # pgTAP de supabase/tests/ (PR-025 y anteriores)
#   uv run pytest         # unit + integration (con DB local levantada)
# Los tests de integracion de services/crawler/tests/integration ya hacen
# skip limpio en CI sin BD (pytest.mark.skipif sobre _db_available()).
#
# Hardening PR-037 (security-review P2-CI): actions pineadas por SHA completo
# (supply-chain, sin tags moviles) y permissions minimas del job.
name: python-crawler-quality

on:
  pull_request:
    paths:
      - "services/crawler/**"
      - "services/search-spike/**"
      - ".github/workflows/python-crawler-quality.yml"
  push:
    branches: [main]
    paths:
      - "services/crawler/**"
      - "services/search-spike/**"
      - ".github/workflows/python-crawler-quality.yml"

concurrency:
  group: python-crawler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-crawler-quality:
    runs-on: ubuntu-latest
    # Permisos minimos (security-review P2-CI): el job solo lee el contenido
    # del repo; sin tokens de escritura ni id-token.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/crawler
    steps:
      # actions/checkout v4 (misma version que python-quality.yml) — pin por SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        # astral-sh/setup-uv v5 (misma version que python-quality.yml) — pin por SHA
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Setup Python 3.11
        # actions/setup-python v5 (misma version que python-quality.yml) — pin por SHA
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies (reproducible)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format --check)
        run: uv run ruff format --check

      - name: Typecheck (mypy)
        # Solo xtrace_crawler: xtrace_spike (dep editable, ADR-0011) no publica
        # py.typed, asi que mypy sobre tests falla con [import-untyped] en CI
        # (decision de revision PR-019, opcion a). El gate local que pasa es
        # `uv run mypy xtrace_crawler`.
        run: uv run mypy xtrace_crawler

      - name: Tests (pytest)
        run: uv run pytest
