# CI del servicio Python del spike (PR-001 · FR-017 · ADR-0003).
# Aditivo: no altera la pipeline JS existente (quality.yml).
name: python-quality

on:
  pull_request:
    paths:
      - "services/search-spike/**"
      - ".github/workflows/python-quality.yml"
      - "compose.yaml"
  push:
    branches: [main]
    paths:
      - "services/search-spike/**"
      - ".github/workflows/python-quality.yml"
      - "compose.yaml"

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search-spike
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (reproducible)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Format check (ruff format --check)
        run: uv run ruff format --check

      - name: Typecheck (mypy)
        run: uv run mypy xtrace_spike tests

      - name: Tests (pytest)
        run: uv run pytest
