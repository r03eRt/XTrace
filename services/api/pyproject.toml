[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xtrace-api"
version = "0.1.0"
description = "Servicio API REST de búsqueda visual de XTrace (spec 003, FR-006, ADR-0012)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.34,<1",
    # Pipeline del spike reutilizado como dependencia editable (ADR-0011/0012):
    # la API añade solo transporte HTTP, contrato y analítica propios.
    "xtrace-spike",
]

# Extra opcional `siglip` (paridad con spike/crawler · ADR-0012): dependencias
# para las validaciones reales del operador con `XTRACE_EMBEDDING_PROVIDER=siglip`
# (`SiglipLocalProvider` de xtrace_spike necesita open-clip-torch + torch).
# Se instala SOLO donde se necesite (`uv sync --extra siglip`, quickstart.md),
# no en el grupo dev (CI sin torch, NFR-003).
[project.optional-dependencies]
siglip = [
    "open-clip-torch<3",
    "torch<2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
xtrace-api = "xtrace_api.main:app"

# Fuente del paquete xtrace-spike: camino editable al servicio del spike
# (ADR-0011/0012; el spike permanece intocado y cerrado).
[tool.uv.sources]
xtrace-spike = { path = "../search-spike", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
