[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xtrace-spike"
version = "0.1.0"
description = "Servicio del spike de búsqueda visual de XTrace: CLI interna (FR-017, ADR-0003/0008)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imagehash>=4.3.2",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "typer>=0.15,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
xtrace-spike = "xtrace_spike.cli:app"

[project.optional-dependencies]
siglip = [
    "open-clip-torch<3",
    "torch<2.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
