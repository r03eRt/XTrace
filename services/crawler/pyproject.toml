[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xtrace-crawler"
version = "0.1.0"
description = "Servicio crawler de XTrace: ingesta de fuentes web al índice visual (spec 002, FR-003, ADR-0011)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic-settings>=2.6,<3",
    "selectolax>=0.3,<1",
    "typer>=0.15,<1",
    # Pipeline del spike reutilizado como dependencia editable (ADR-0011):
    # el crawler añade solo adapters/jobs/rate limits/assets/repo propios.
    "xtrace-spike",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
xtrace-crawler = "xtrace_crawler.cli:app"

# Fuente del paquete xtrace-spike: camino editable al servicio del spike
# (ADR-0011; el spike permanece intocado y cerrado).
[tool.uv.sources]
xtrace-spike = { path = "../search-spike", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
